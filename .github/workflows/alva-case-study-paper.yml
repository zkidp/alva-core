name: ALVA case-study manuscript
on:
  pull_request:
    paths:
      - 'docs/papers/alva-case-study-v0/**'
      - '.github/workflows/alva-case-study-paper.yml'
permissions:
  contents: read
jobs:
  manuscript:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact evidence, citations, links and figure sources
        run: python docs/papers/alva-case-study-v0/check.py
      - run: python -m pip install -r docs/papers/alva-case-study-v0/requirements.txt
      - name: Compile reviewable HTML (no model or candidate execution)
        run: python docs/papers/alva-case-study-v0/build.py --output .local/alva-case-study-v0
      - uses: actions/upload-artifact@v4
        with:
          name: alva-case-study-v0-${{ matrix.os }}
          path: .local/alva-case-study-v0/
