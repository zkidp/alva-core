name: Public maintenance consumer
on:
  pull_request:
    paths:
      - 'examples/maintenance_packing/**'
      - 'scripts/maintenance_consumer_walkthrough.py'
      - 'tests/integrations/test_maintenance_consumer.py'
      - 'docs/maintenance-consumer-quickstart.md'
      - '.github/workflows/maintenance-consumer.yml'
permissions:
  contents: read
jobs:
  packaging:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.integrations.test_maintenance_consumer -v
  real-linux-stdio:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap util-linux
      - run: cargo build --locked --manifest-path alva/Cargo.toml
      - name: Actual isolated consumer round trip
        shell: bash
        run: |
          python scripts/maintenance_consumer_walkthrough.py \
            --alva "$PWD/alva/target/debug/alva" \
            --toolchain "$(rustc --print sysroot)" \
            --registry "${CARGO_HOME:-$HOME/.cargo}/registry" \
            --output "$PWD/.local/consumer"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-consumer-stdio-and-checks
          path: .local/consumer/
