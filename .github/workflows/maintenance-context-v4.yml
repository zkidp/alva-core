name: Maintenance compact context (zero models)
on:
  push:
    branches: [codex/host-context-v4]
  pull_request:
    paths: ['alva/src/codegen.rs', 'integrations/codex/maintenance_context.py', 'integrations/skills/alva-host/**', 'benchmarks/context_v4/**', 'tests/mcp/context_reference_test.py', '.github/workflows/maintenance-context-v4.yml']
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Compiler and references
        run: |
          cargo fmt --check --manifest-path alva/Cargo.toml
          cargo clippy --locked --manifest-path alva/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path alva/Cargo.toml
          cargo build --locked --manifest-path alva/Cargo.toml
          python -m unittest tests.integrations.test_maintenance_context tests.integrations.test_context_protocol -v
          binary=alva/target/debug/alva
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          python tests/mcp/context_reference_test.py "$binary"
          python tests/mcp/mcp_protocol_test.py "$binary"
          python tests/mcp/maintenance_profile_test.py "$binary"
          bash tests/run_conformance.sh
      - name: Linux isolated new-task qualification
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y bubblewrap util-linux
          python benchmarks/context_v4/preflight.py --alva alva/target/debug/alva \
            --toolchain "$(rustc --print sysroot)" \
            --registry "${CARGO_HOME:-$HOME/.cargo}/registry" \
            --output out/context-v4/preflight.json
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: context-v4-no-model-preflight
          path: out/context-v4/*.json
