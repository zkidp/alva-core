name: Homepage documentation
on:
  pull_request:
    paths:
      - 'README*.md'
      - 'docs/getting-started.md'
      - 'docs/development-preview.md'
      - 'tests/docs/homepage_test.py'
      - '.github/workflows/homepage.yml'
permissions:
  contents: read
jobs:
  onboarding:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/docs/homepage_test.py -v
