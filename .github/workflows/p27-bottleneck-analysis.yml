name: P27 archived accounting (zero models)
on:
  pull_request:
    paths:
      - 'benchmarks/p27_bottleneck/**'
      - 'docs/p26-execution-bottleneck-analysis.md'
      - '.github/workflows/p27-bottleneck-analysis.yml'
permissions:
  contents: read
jobs:
  accounting:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic accounting and public source consistency only
        shell: bash
        run: |
          mkdir -p out
          python -m unittest benchmarks.p27_bottleneck.test_audit -v > out/p27-tests.log 2>&1
          cat out/p27-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p27-accounting-${{ matrix.os }}
          path: out/p27-tests.log
