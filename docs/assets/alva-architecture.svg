<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ALVA architecture in the coding-agent stack</title>
  <desc id="desc">Coding agents connect through MCP, CLI, and a shared Skill to ALVA semantic views, typed operations, transaction runtime, and typed program representation before Rust code generation produces native and WASM outputs.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#0E1426"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C63FF"/>
      <stop offset="1" stop-color="#38CFFF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#25304A" stroke-width="1" opacity="0.22"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#38CFFF"/>
    </marker>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#45E6A8"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
      .eyebrow { fill: #73809B; font-size: 20px; font-weight: 700; letter-spacing: 2px; }
      .heading { fill: #EDF3FF; font-size: 30px; font-weight: 700; }
      .body { fill: #A9B5CC; font-size: 23px; }
      .operation { fill: #A9B5CC; font-size: 21px; }
      .surface { fill: #11182B; stroke: #25304A; stroke-width: 2; }
      .flow { fill: none; stroke: #38CFFF; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="1598" height="898" rx="27" fill="none" stroke="#25304A" stroke-width="2"/>
  <rect x="1" y="1" width="1598" height="898" rx="27" fill="url(#grid)"/>

  <!-- Agent hosts -->
  <g>
    <rect x="170" y="42" width="1260" height="142" rx="26" class="surface"/>
    <text x="800" y="83" text-anchor="middle" class="sans eyebrow">CODING AGENT</text>
    <text x="800" y="126" text-anchor="middle" class="sans heading">Codex · Claude Code · MCP Host</text>
    <text x="800" y="159" text-anchor="middle" class="sans body">Discovers one canonical semantic-edit workflow</text>
  </g>

  <path d="M 800 184 V 246" class="flow"/>
  <rect x="681" y="199" width="238" height="38" rx="19" fill="#0B1020" stroke="#25304A" stroke-width="2"/>
  <text x="800" y="225" text-anchor="middle" class="mono body">MCP / CLI / Skill</text>

  <!-- ALVA boundary -->
  <g>
    <rect x="150" y="252" width="1300" height="456" rx="34" fill="#0D1428" stroke="url(#accent)" stroke-width="4"/>
    <rect x="192" y="276" width="166" height="44" rx="22" fill="#171E38" stroke="#7C63FF" stroke-width="2"/>
    <text x="275" y="307" text-anchor="middle" class="sans eyebrow" fill="#EDF3FF">ALVA</text>
    <text x="1388" y="307" text-anchor="end" class="sans eyebrow">SEMANTIC RUNTIME + COMPILER</text>

    <!-- Views -->
    <rect x="205" y="350" width="365" height="205" rx="22" class="surface"/>
    <circle cx="244" cy="390" r="9" fill="#7C63FF"/>
    <text x="268" y="400" class="sans heading">Semantic Views</text>
    <text x="244" y="447" class="mono operation">resolve · inspect</text>
    <text x="244" y="481" class="mono operation">dependencies · callers</text>
    <text x="244" y="515" class="mono operation">body</text>

    <!-- Transaction runtime -->
    <rect x="618" y="338" width="364" height="250" rx="24" fill="#11182B" stroke="#38CFFF" stroke-width="3"/>
    <text x="800" y="385" text-anchor="middle" class="sans heading">Transaction Runtime</text>
    <text x="667" y="435" class="mono operation">stage</text>
    <text x="667" y="471" class="mono operation">semantic diff</text>
    <text x="667" y="507" class="mono operation">check</text>
    <text x="667" y="543" class="mono operation" fill="#45E6A8">commit / abort</text>
    <path d="M 846 425 V 540" stroke="#45E6A8" stroke-width="3" marker-end="url(#arrow-mint)"/>

    <!-- Operations -->
    <rect x="1030" y="350" width="365" height="205" rx="22" class="surface"/>
    <circle cx="1069" cy="390" r="9" fill="#38CFFF"/>
    <text x="1093" y="400" class="sans heading">Typed Operations</text>
    <text x="1069" y="447" class="mono operation">applicable_operations</text>
    <text x="1069" y="481" class="mono operation">describe_operation</text>
    <text x="1069" y="515" class="mono operation">construct</text>

    <path d="M 570 455 H 610" class="flow"/>
    <path d="M 1030 455 H 990" class="flow"/>

    <!-- Program representation -->
    <path d="M 800 588 V 612" class="flow"/>
    <rect x="330" y="615" width="940" height="66" rx="20" fill="#101A2D" stroke="#45E6A8" stroke-width="2"/>
    <g transform="translate(382 648)">
      <path d="M 0 0 H 72" stroke="#38CFFF" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#7C63FF"/>
      <circle cx="36" cy="0" r="8" fill="#38CFFF"/>
      <circle cx="72" cy="0" r="8" fill="#45E6A8"/>
    </g>
    <text x="690" y="658" text-anchor="middle" class="sans heading">Typed Program Representation</text>
    <text x="1218" y="657" text-anchor="end" class="mono" fill="#A9B5CC" font-size="18">content-addressed revisions</text>
  </g>

  <!-- Code generation and targets -->
  <path d="M 800 708 V 744" class="flow"/>
  <rect x="650" y="750" width="300" height="66" rx="20" class="surface"/>
  <text x="800" y="792" text-anchor="middle" class="sans heading">Rust Codegen</text>

  <path d="M 800 816 V 832 M 800 832 L 622 850 M 800 832 L 978 850" fill="none" stroke="#38CFFF" stroke-width="3"/>
  <rect x="480" y="838" width="284" height="48" rx="18" class="surface"/>
  <text x="622" y="870" text-anchor="middle" class="sans body">Native</text>
  <rect x="836" y="838" width="284" height="48" rx="18" class="surface"/>
  <text x="978" y="870" text-anchor="middle" class="sans body">WASM/WASI</text>
</svg>
